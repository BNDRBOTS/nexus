<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus</title>
<meta name="description" content="Nexus: projects, chats, workspace files, tools, and workflows on one engine.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="app">

  <aside id="sidebar" class="sidebar" aria-label="Navigation">
    <div class="brand"><span class="mark" aria-hidden="true"></span><span class="brand-name">Nexus</span></div>
    <button id="newChat" class="btn primary block">New chat <kbd>Ctrl K</kbd></button>
    <input id="search" class="input" type="search" placeholder="Search chats" aria-label="Search chats">

    <div class="nav-h">Projects <button id="newProject" class="mini" title="New project">+</button></div>
    <div id="projectList" class="nav-list"></div>

    <div class="nav-h">Chats</div>
    <div id="chatList" class="nav-list grow"></div>

    <div class="sidebar-foot">
      <button id="openSettings" class="btn ghost block">Settings</button>
      <button id="statusPill" class="status-pill" title="Model status"><span class="dot"></span><span id="statusText">checking</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="toggleSidebar" class="icon-btn only-narrow" aria-label="Toggle sidebar">&#9776;</button>
      <div id="crumbs" class="crumbs"></div>
      <div id="modeSeg" class="seg" role="radiogroup" aria-label="Mode"></div>
      <select id="roleSelect" class="select" aria-label="Role"></select>
      <div class="spacer"></div>
      <nav id="panelToggles" class="panel-toggles" aria-label="Panels"></nav>
    </header>

    <section id="stage" class="stage" aria-live="polite">
      <div id="empty" class="empty hidden"></div>
      <div id="messages" class="messages"></div>
    </section>

    <footer class="composer-wrap">
      <div class="composer">
        <div id="attachments" class="chips"></div>
        <textarea id="input" class="input-area" rows="1" placeholder="Ask, build, or type / for commands" aria-label="Message"></textarea>
        <div class="composer-bar">
          <div id="toolChips" class="chips tools" aria-label="Tools"></div>
          <div class="spacer"></div>
          <span class="hint">Enter sends &middot; Shift+Enter newline</span>
          <button id="send" class="send" aria-label="Send">&uarr;</button>
        </div>
      </div>
      <div id="cmdHelp" class="cmd-help hidden"></div>
    </footer>
  </main>

  <aside id="panel" class="panel hidden" aria-label="Workspace panel">
    <div class="panel-h">
      <div id="tabs" class="tabs" role="tablist"></div>
      <button id="closePanel" class="icon-btn" aria-label="Close panel">&times;</button>
    </div>
    <div id="panelBody" class="panel-body"></div>
  </aside>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card" id="modalCard"></div></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="js/00-core.js"></script>
<script src="js/05-knacks.js"></script>
<script src="js/10-chat.js"></script>
<script src="js/20-panels.js"></script>
<script src="js/30-settings.js"></script>
<script src="js/90-boot.js"></script>
</body>
</html>
